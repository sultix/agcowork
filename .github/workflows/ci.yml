name: ci

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: dotnet build --configuration Release
      # The build writes the OpenAPI document; the checked-in copy is the contract of the Angular client.
      - name: Check OpenAPI document is up to date
        run: |
          if ! git diff --exit-code -- src/backend/Agcowork.Api/openapi/ || [ -n "$(git ls-files --others --exclude-standard -- src/backend/Agcowork.Api/openapi/)" ]; then
            echo "::error::src/backend/Agcowork.Api/openapi/v1.json is stale: run 'dotnet build src/backend/Agcowork.Api', then commit openapi/v1.json (and regenerate the client with 'npm run api:generate' in src/frontend)."
            exit 1
          fi
      # Integration tests use Testcontainers (Postgres) via the runner's Docker.
      - run: dotnet test --configuration Release --no-build

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json
      - run: npm ci
      # Types are generated from the checked-in OpenAPI document; a diff means they were not regenerated.
      - name: Check generated API types are up to date
        run: |
          npm run api:generate
          # --porcelain also lists untracked files (e.g. a newly generated file that was never committed).
          if [ -n "$(git status --porcelain -- src/app/core/api/generated/)" ]; then
            git status --porcelain -- src/app/core/api/generated/
            git diff -- src/app/core/api/generated/
            echo "::error::Generated API types are stale: run 'npm run api:generate' in src/frontend and commit."
            exit 1
          fi
      - run: npm run lint
      - run: npm test
      - run: npm run build

  images:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      # Build only (no push) so the Dockerfiles do not rot. Compose needs the variables to interpolate.
      - run: cp .env.example .env
      - uses: docker/setup-buildx-action@v3
      - uses: docker/bake-action@v6
        with:
          source: .
          files: docker-compose.yml
          targets: api,web
          set: |
            *.cache-from=type=gha
            *.cache-to=type=gha,mode=max
