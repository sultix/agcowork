# Serves the Angular build and proxies API, health, OpenAPI and MCP paths to the api service.
# Docker's embedded DNS; the upstream is re-resolved so a recreated api container (new IP) is found.
resolver 127.0.0.11 valid=10s ipv6=off;

upstream agcowork_api {
    zone agcowork_api 64k;
    server api:8080 resolve;
    keepalive 16;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location ^~ /api/ { proxy_pass http://agcowork_api; }
    location ^~ /health { proxy_pass http://agcowork_api; }
    location ^~ /openapi/ { proxy_pass http://agcowork_api; }

    # MCP (Streamable HTTP): no buffering, long read timeout. Only the MCP paths, not the SPA routes under /w/.
    location ~ ^/mcp/?$ {
        proxy_pass http://agcowork_api;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
    location ~ ^/w/[^/]+/mcp/?$ {
        proxy_pass http://agcowork_api;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Hashed assets are immutable.
    location ~* \.(?:js|css|woff2)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA fallback.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
